<text x="904" y="210" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#17332D">1</text>
<text x="986" y="210" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#17332D">0..*</text>
<text x="950" y="270" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#17332D">requestId</text>
<polyline points="710,440 710,505" fill="none" stroke="#17332D" stroke-width="2"/>
<text x="731" y="459" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#17332D">1</text>
<text x="744" y="491" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#17332D">0..*</text>
<text x="258" y="470" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#17332D">Sequelize models expose</text>
<text x="258" y="506" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#17332D">create  findAll  findByPk  update</text>
<text x="258" y="542" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#17332D">All models have automatic</text>
<text x="258" y="570" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#17332D">id and timestamp columns</text>
