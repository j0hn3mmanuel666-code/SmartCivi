<text x="545" y="581" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#17332D">id : INTEGER PK    requestId : INTEGER FK</text>
<text x="545" y="607" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#17332D">fullName email phone region : STRING</text>
<text x="545" y="633" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#17332D">documentType relationship givenName familyName : STRING</text>
<text x="545" y="659" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#17332D">middleName fatherName motherName : STRING optional</text>
<text x="545" y="685" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#17332D">birthdate : DATE optional    appointmentDate : DATE</text>
<text x="545" y="711" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#17332D">status : ENUM    notes : TEXT optional</text>
<polyline points="400,200 530,200" fill="none" stroke="#17332D" stroke-width="2" stroke-dasharray="7 6"/>
<text x="465" y="157" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#17332D">email match</text>
<text x="414" y="222" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#17332D">0..1</text>
<text x="509" y="222" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#17332D">0..*</text>
