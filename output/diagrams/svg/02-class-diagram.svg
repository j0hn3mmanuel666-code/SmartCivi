<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<rect width="100%" height="100%" fill="white"/>
<rect x="40" y="70" width="360" height="290" rx="3" fill="#EDF3F8" stroke="#17332D" stroke-width="2"/>
<text x="220.0" y="99" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#17332D">User</text>
<polyline points="40,119 400,119" fill="none" stroke="#17332D" stroke-width="2"/>
<text x="55" y="146" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#17332D">id : INTEGER PK</text>
<text x="55" y="172" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#17332D">name : STRING</text>
<text x="55" y="198" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#17332D">email : STRING UNIQUE</text>
<text x="55" y="224" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#17332D">password : STRING bcrypt hash</text>
