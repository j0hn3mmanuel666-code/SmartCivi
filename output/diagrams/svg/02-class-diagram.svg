<text x="1025" y="302" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#17332D">uploadedBy : STRING</text>
<text x="1025" y="328" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#17332D">createdAt updatedAt : DATE</text>
