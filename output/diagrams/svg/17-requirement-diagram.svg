<text x="700.0" y="454" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#17332D">&lt;&lt;requirement&gt;&gt; R5  Owner visibility</text>
<polyline points="510,474 890,474" fill="none" stroke="#17332D" stroke-width="2"/>
