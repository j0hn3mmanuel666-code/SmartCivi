<text x="240.0" y="687.5" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#17332D">MySQL and named volume</text>
<polyline points="240,650 240,570" fill="none" stroke="#17332D" stroke-width="2" stroke-dasharray="7 6"/>
<polygon points="240,570 235.0,582.0 245.0,582.0" fill="#17332D"/>
<text x="325" y="614" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#66746E">&lt;&lt;satisfy&gt;&gt;</text>
