<text x="240.0" y="94" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#17332D">&lt;&lt;requirement&gt;&gt; R1  Account access</text>
<polyline points="50,114 430,114" fill="none" stroke="#17332D" stroke-width="2"/>
<text x="65" y="141" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#17332D">The system shall register users</text>
<text x="65" y="167" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#17332D">and authenticate passwords.</text>
<rect x="50" y="290" width="380" height="75" rx="3" fill="#EDF3F8" stroke="#17332D" stroke-width="2"/>
<text x="240.0" y="327.5" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#17332D">Auth controller and bcrypt</text>
<polyline points="240,290 240,210" fill="none" stroke="#17332D" stroke-width="2" stroke-dasharray="7 6"/>
