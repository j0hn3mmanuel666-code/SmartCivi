<text x="700.0" y="687.5" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#17332D">myRequestsPage</text>
<polyline points="700,650 700,570" fill="none" stroke="#17332D" stroke-width="2" stroke-dasharray="7 6"/>
<polygon points="700,570 695.0,582.0 705.0,582.0" fill="#17332D"/>
<text x="785" y="614" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#66746E">&lt;&lt;satisfy&gt;&gt;</text>
<rect x="970" y="425" width="380" height="145" rx="3" fill="#FBF1D9" stroke="#17332D" stroke-width="2"/>
<text x="1160.0" y="454" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#17332D">&lt;&lt;requirement&gt;&gt; R6  Payment prototype</text>
<polyline points="970,474 1350,474" fill="none" stroke="#17332D" stroke-width="2"/>
<text x="985" y="501" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#17332D">Payment handling shall require</text>
<text x="985" y="527" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#17332D">an approved owned request.</text>
