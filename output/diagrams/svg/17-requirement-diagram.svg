<text x="525" y="167" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="middle" fill="#17332D">submit a civil registry request.</text>
<rect x="510" y="290" width="380" height="75" rx="3" fill="#EDF3F8" stroke="#17332D" stroke-width="2"/>
<text x="700.0" y="327.5" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#17332D">createRequest and Request</text>
<polyline points="700,290 700,210" fill="none" stroke="#17332D" stroke-width="2" stroke-dasharray="7 6"/>
